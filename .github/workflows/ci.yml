name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGO_URL: mongodb://localhost:27017
      # The suite refuses to run against the database the shop uses, so give
      # it a name of its own.
      TEST_DB_NAME: nayara_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt

      - name: Lint
        working-directory: backend
        run: flake8 app scripts tests

      - name: Check formatting
        working-directory: backend
        run: black --check app scripts tests

      - name: Check types
        working-directory: backend
        run: mypy app

      - name: Test
        working-directory: backend
        run: python scripts/run_tests.py

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Lint
        working-directory: frontend
        run: yarn lint

      - name: Build
        working-directory: frontend
        env:
          # Treat build warnings as failures.
          CI: "true"
        run: yarn build

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks reads the commit history, and the default shallow clone
          # would hand it a single commit.
          fetch-depth: 0

      # The command-line tool is used rather than the marketplace action
      # because the action asks organisations for a licence key, and pinning
      # the version keeps the scan reproducible.
      - name: Scan the history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          # --redact keeps any finding out of the public build log.
          ./gitleaks detect --source . --redact --no-banner

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip setuptools
          pip install pip-audit

      - name: Audit Python dependencies
        working-directory: backend
        run: pip-audit --requirement requirements.txt --strict

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      # Advisory for now. The build toolchain carries transitive advisories
      # that cannot be resolved without replacing Create React App, so this
      # reports them without blocking. Make it enforcing once that migration
      # has happened and the remaining findings have been triaged.
      - name: Audit JavaScript dependencies
        working-directory: frontend
        continue-on-error: true
        run: yarn audit --level high
