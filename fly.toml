# Fly.io configuration. Mumbai is chosen because the MongoDB Atlas cluster
# responds in single-digit milliseconds from India; hosting elsewhere would add
# that distance to every query on every page.

app = "nayara"
primary_region = "bom"

[build]

[env]
  ENVIRONMENT = "production"
  PORT = "8080"
  # Two workers each hold their own MongoDB pool. Kept well under the
  # cluster's 500-connection limit, with room for a deploy to overlap.
  WEB_CONCURRENCY = "2"
  MONGO_MAX_POOL_SIZE = "20"

[http_service]
  internal_port = 8080
  force_https = true
  # A shop that sleeps makes the first visitor wait for a cold start, so keep
  # one machine running.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 80
    hard_limit = 120

# Readiness checks MongoDB as well, so an instance that loses its database is
# taken out of rotation instead of serving failures.
[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health/ready"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
